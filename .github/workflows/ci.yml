name: Studio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: developer_card
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: developer_card
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      POSTGRES_USER: developer_card
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: developer_card
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings.ci
      - run: python backend/manage.py test workspace.tests --settings=config.settings.ci
      - run: python backend/manage.py migrate --noinput --settings=config.settings.ci
      - run: python backend/manage.py check --settings=config.settings.ci
      - run: cp .env.example .env && docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: npm --prefix frontend test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
