map $http_x_forwarded_proto $origin_scheme {
  default $scheme;
  https https;
}
server {
    # Card uploads: 10 MiB image plus multipart overhead.
    client_max_body_size 12m;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;

  location = /robots.txt { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $origin_scheme; }
  location = /sitemap.xml { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $origin_scheme; }
  # Vite uses URL-safe hashes, not only hexadecimal characters.
  location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /assets/ { try_files $uri =404; }

  location ~ /\. { deny all; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $origin_scheme; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 180s; }
  location /auth/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $origin_scheme; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 180s; }
  location /telegram/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $origin_scheme; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
}
