map $http_x_forwarded_proto $origin_scheme {
  default $scheme;
  https https;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location ~ /\. { deny all; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $origin_scheme; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 180s; }
  location /auth/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $origin_scheme; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 180s; }
  location /telegram/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $origin_scheme; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location / { try_files $uri $uri/ /index.html; }
}
