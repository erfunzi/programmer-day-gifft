services:
  web:
    build: .
    container_name: developer-card
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "80"
      CACHE_DIR: /app/.cache
      TRUST_PROXY: "true"
    volumes:
      - github-cache:/app/.cache
volumes:
  github-cache:
