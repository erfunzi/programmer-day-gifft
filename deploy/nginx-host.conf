# Host nginx site for developer.lyroo.space
# Install:
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/developer.lyroo.space
#   sudo ln -sf /etc/nginx/sites-available/developer.lyroo.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (after DNS points here):
#   sudo certbot --nginx -d developer.lyroo.space

server {
    listen 80;
    listen [::]:80;
    server_name developer.lyroo.space;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
